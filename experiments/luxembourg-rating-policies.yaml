name: luxembourg-rating-policies

dimensions:
  graph: {lux: luxembourg.osm.graph}
  size:
    eight: {filter_k: 8, blocks: 8}
  policy:
    baseline: ignore
    skip: skip_natural_edge
    zero: natural_edge_contribute_zero
    negative: natural_edge_contribute_negative
  run: [1, 2, 3, 4, 5]

stages:
  - tool: metis_graph
    inputs: {path: "${graph}"}
  - tool: region_filter
    inputs:
      options: {k: "${size.filter_k}"}
  - tool: mt_kahypar
    vary: [run]
    inputs:
      options:
        blocks: "${size.blocks}"
        c_rating_edge_metadata: "${policy}"
        epsilon: 0.03
        objective: cut
        preset_type: default
        threads: 4
