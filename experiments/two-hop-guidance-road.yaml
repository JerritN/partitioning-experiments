name: two-hop-guidance-road

dimensions:
  graph:
    netherlands: netherlands.osm.graph
    italy: italy.osm.graph
  policy:
    baseline: ignore
    zero: natural_edge_contribute_zero
  two_hop:
    enabled: "1"
    disabled: "0"
  filter_seed: [1, 2, 3, 4, 5]
  partition_seed: [1, 2, 3, 4, 5]

stages:
  - tool: metis_graph
    inputs:
      path: "${graph}"

  - tool: region_filter
    inputs:
      options:
        k: 8
        seed: "${filter_seed}"

  - tool: mt_kahypar
    inputs:
      options:
        blocks: 8
        threads: 1
        seed: "${partition_seed}"
        c_use_two_hop: "${two_hop}"
        c_rating_edge_metadata: "${policy}"
        epsilon: 0.03
        objective: cut
        preset_type: default